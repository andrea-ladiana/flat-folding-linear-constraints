[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linfold"
version = "0.1.0"
description = "The linear constraints of flat folding: rows, pairs, blocks and certificates of non-flat-foldability for origami crease patterns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrea Ladiana", email = "andrea.ladiana@uniroma1.it" }]
keywords = ["origami", "flat folding", "crease pattern", "Maekawa", "Kawasaki",
            "computational geometry", "F2", "linear algebra"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
linfold = "linfold.cli:main"

[project.urls]
Homepage = "https://github.com/andrea-ladiana/flat-folding-linear-constraints"
Source = "https://github.com/andrea-ladiana/flat-folding-linear-constraints/tree/main/software"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
